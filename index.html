const MY=[['“His name was D.B. Cooper.”','He bought the ticket as Dan Cooper. “D.B.” came from a press mix-up with an unrelated man Portland police had questioned.'],['“He was an expert skydiver.”','Experts split. A suit, loafers, rain, darkness and a rig he never inspected point the other way.'],['“The case is closed.”','In July 2016 the FBI ended active investigation but still takes physical evidence, and the ransom serials stay public.'],['“The bomb was real.”','Never verified. The crew saw red cylinders and wire, and no explosive was recovered.'],['“It was a one-off.”','Copycat hijackings followed in 1972 and helped push the US toward universal airport screening in January 1973.'],['“The money surfaced everywhere.”','Only the 290 bills at Tena Bar. None has ever turned up in circulation.'],['“Mt. St. Helens buried him.”','The eruption came in 1980, nine years after the jump and three months after the cash find. It complicates searches but can’t explain the disappearance.'],['“Weber confessed, case solved.”','His wife recalled the words. The FBI’s prints and DNA comparison found no match.'],['“He picked the 727 by luck.”','The 727’s tail stair could be lowered in flight. Boeing later added the Cooper vane to stop that.']];
V.myth=()=>`<div class="pn"><h3>Myth vs fact · tap a card to flip it</h3></div><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${MY.map(m=>`<div class="fc"><div class="fi"><div>${m[0]}<p class="dim">Tap to check</p></div><div>${m[1]}</div></div></div>`).join('')}</div>`;
P.myth=()=>$$('.fc').forEach(e=>e.onclick=()=>e.classList.toggle('o'));
const AR=[['FBI case page','The official summary with the hijacker’s description and composite sketches. Look for the version with sunglasses and the one without.','https://www.fbi.gov/history/famous-cases/dbcooper-hijacking'],['FBI Vault','Scanned case files, memos and lab reports. Search the vault for “D.B. Cooper”.','https://vault.fbi.gov'],['Wikimedia Commons','Search for public-domain photos of the 727, the Tena Bar money and recovered evidence.','https://commons.wikimedia.org/w/index.php?search=D.B.+Cooper'],['What to look for: the plane','Boeing 727-51 N467US. Find the lower tail stair housing, then compare later 727s that carry the Cooper vane.'],['What to look for: the money','The 1980 photos show three bundles of $20s with rubber bands rotted away. Check the “L” serial prefixes.'],['What to look for: the tie','Lab photos show the black clip-on and the pearl clip. Sleuths zoom in on where particles were sampled.']];
V.arc=()=>`<div class="pn"><h3>Photo archive</h3><p>Real photographs can’t load inside this page, so this points to the originals and what to look for in each.</p></div>${AR.map(a=>`<div class="pn"><h3>${a[0]}</h3><p>${a[1]}</p>${a[2]?`<a class="b" href="${a[2]}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Open source</a>`:''}</div>`).join('')}`;

const ND=[
{i:'sketch',m:'sketch',c:'The composites',x:3,y:2,w:46,r:-3,t:'FBI composite sketches',d:'Two drawings built from witness descriptions, one with sunglasses and one without. They remain the face the public pictures when it hears “Cooper”.',n:['Dark lenses hide the eyes, which is why a second version exists','High forehead and conservatively combed hair','Dark lapels and a white collar at the bottom edge']},
{i:'plane',m:'plane',c:'A Northwest 727',x:52,y:3,w:44,r:2.5,t:'A Northwest Orient 727',d:'A red-tailed Northwest 727-100 on approach. Flight 305 was a 727-51 in this airline’s livery. This shows the type; I can’t confirm it is the exact aircraft.',n:['All three engines sit at the rear, including the one in the tail','The tail stair sits under the tail cone, out of view at this angle','That stair could be lowered in flight, which is why Cooper chose this jet']},
{i:'n1',c:'SEAT 18-C',tx:'Tie, clip and eight Raleigh butts were recovered here.',x:60,y:16,w:32,r:3,t:'Seat 18-C',d:'Cooper’s assigned seat. Nearly all the physical evidence from the cabin traces back to this spot.',n:['The tie and clip were left behind','Eight Raleigh filter-tip butts','Dozens of latent prints, mostly unmatched']},
{i:'seat',m:'seat',c:'Seating plan',x:65,y:22,w:30,r:-2,t:'727 seating plan',d:'An annotated 727-100 plan: Cooper’s assigned seat (1), a second seat across the aisle (2), and each flight attendant’s section.',n:['First class is rows 1 to 4, coach rows 5 to 21, 86 coach seats','Schaffner’s section covers rows 16 to 21, which included Cooper','The aft airstair sits behind the last row, a short walk down the aisle','The second seat marks where he is said to have sat later']},
{i:'tie',m:'tie',c:'The tie',x:10,y:25,w:32,r:2,t:'The clip-on tie',d:'The black clip-on tie and its pearl-headed clip, laid out on plastic for photography.',n:['Clip-on hardware at the collar end','A pearl-headed bar clip about mid-blade','Dark fabric that traps fine particles']},
{i:'n2',c:'TITANIUM?',tx:'Particles on the tie are the sleuths’ best lead. Who carries these?',x:12,y:46,w:26,r:-3,t:'The titanium lead',d:'Researchers who examined the tie reported pure titanium and rare-earth compounds. They are associated with aerospace work, which feeds the insider theory, though they have other industrial uses.',n:['Reported findings, not independently verified here','Use the microscope to examine the tie yourself']},
{i:'cabin',m:'cabin',c:'Cabin interior',x:6,y:53,w:40,r:-1.5,t:'Inside a 727 cabin',d:'A 727-style cabin with light-blue seats and overhead racks. Two men crouch in the aisle over a wooden board holding a dark bundle, near a rear door. The caption line appears to credit a state historical society.',n:['The same three-and-three coach layout as Cooper’s cabin','Cables hang from the overhead panel at right','Provenance unconfirmed: I can’t say this is Flight 305’s aircraft']},
{i:'n3',c:'$200,000',tx:'10,000 twenty-dollar bills. Only 290 ever resurfaced.',x:54,y:52,w:36,r:2,t:'The ransom',d:'About 21 lb of $20 bills, serials microfilmed before handover. Only the Tena Bar bundles have ever been found.',n:['Mostly “L” series notes from the San Francisco Federal Reserve','9,710 bills are still missing']},
{i:'money',m:'money',c:'Recovered bills',x:52,y:60,w:42,r:-2,t:'Recovered ransom bills',d:'Water-ruined $20 bills fused into pulpy bundles. Jackson’s portrait is still readable and the circled “L” seal shows on several.',n:['The circled L marks the San Francisco district','Edges rotted and bundles fused by years in river sand','Serial numbers needed lab work to read']},
{i:'n4',c:'TENA BAR 1980',tx:'Brian Ingram, age 8. $5,800 on the riverbank.',x:6,y:75,w:28,r:-2,t:'Tena Bar, February 1980',d:'A boy on a family picnic found three bundles on the Columbia River bank. It remains the only ransom ever recovered.',n:['290 bills with serials matching the ransom','The rubber bands had rotted away','Dredged sand placed there in 1974 helps date the deposit']},
{i:'dig',m:'dig',c:'Digging the bank',x:40,y:77,w:36,r:2,t:'Digging a river bank',d:'About eight people with shovels work one trench on a sandy bank beside a wide river, like the searches made on the Columbia after the 1980 find. The caption isn’t confirmed.',n:['Flat sandy shoreline with a wide river behind','Plaid work shirts and shovels, a dig team','Likely the Tena Bar search, but unconfirmed']}];
const LK=[['sketch','plane','The people who built this face watched him aboard a Northwest 727.'],['sketch','tie','Witnesses described a dark suit and narrow tie; the tie itself was left behind.'],['plane','seat','Row 18 sits toward the rear of the cabin, a short walk from the tail stair.'],['seat','n1','Cooper’s assigned seat was 18-C.'],['n1','tie','The tie and clip were found at this seat.'],['tie','n2','Particles on the tie are the sleuths’ best lead.'],['seat','cabin','Same coach layout as the plan shows.'],['n3','money','The ransom bills as they look today.'],['money','n4','The only recovered bundles came from Tena Bar.'],['n4','dig','The find sent searchers digging along the bank.'],['n3','n4','Only 290 of 10,000 bills ever resurfaced.']];
V.cork=()=>`<div class="pn"><h3>Evidence board</h3><p class="dim">Tap any photo or note. Hover or tap to light up its red yarn.</p></div><div class="cb" id="cb"><div class="bd" id="bd">${ND.map(n=>`<div class="po${n.m?'':' nt'}" id="n_${n.i}" style="left:${n.x}%;top:${n.y}%;width:${n.w}%;--r:${n.r}deg">${n.m?`<img src="${IM[n.m]}" alt="${n.t}" onload="draw()"><div>${n.c}</div>`:`<b>${n.c}</b>${n.tx}`}</div>`).join('')}<svg id="yn"></svg></div></div>`;
function draw(){const bd=$('#bd'),s=$('#yn');if(!bd||!s)return;s.setAttribute('viewBox',`0 0 ${bd.clientWidth} ${bd.clientHeight}`);const pn=id=>{const e=$('#n_'+id),r=parseFloat(e.style.getPropertyValue('--r'))*Math.PI/180,k=e.offsetHeight/2-8;return[e.offsetLeft+e.offsetWidth/2+k*Math.sin(r),e.offsetTop+e.offsetHeight/2-k*Math.cos(r)]};s.innerHTML=LK.map((l,i)=>{const a=pn(l[0]),b=pn(l[1]),d=Math.hypot(a[0]-b[0],a[1]-b[1]);return`<path class="yl" data-a="${l[0]}" data-b="${l[1]}" pathLength="1" d="M${a[0]} ${a[1]}Q${(a[0]+b[0])/2} ${(a[1]+b[1])/2+20+d*.12} ${b[0]} ${b[1]}" style="animation-delay:${i*.12}s"/>`}).join('')}
